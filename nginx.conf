user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    # Gzip Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Hide nginx version
    server_tokens off;

    # Include configs
    include /etc/nginx/conf.d/*.conf;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ---------------------------
        # Static content
        # ---------------------------
        location / {
            try_files $uri /index.html;
        }

        location /images/ {
            expires 30d;
            root /usr/share/nginx/html;
            try_files $uri /images/placeholder.jpg;
        }

        # ---------------------------
        # Reverse Proxy - APIs
        # ---------------------------

        location /api/catalogue/ {
            proxy_pass http://catalogue-dev.daws88s.space:8080/;

            include proxy_params;
        }

        location /api/user/ {
            proxy_pass http://user-dev.daws88s.space:8080/;

            include proxy_params;
        }

        location /api/cart/ {
            proxy_pass http://cart-dev.daws88s.space:8080/;

            include proxy_params;
        }

        location /api/payment/ {
            proxy_pass http://payment-dev.daws88s.space:8080/;

            include proxy_params;
        }

        location /api/shipping/ {
            proxy_pass http://shipping-dev.daws88s.space:8080/;

            include proxy_params;
        }

        # ---------------------------
        # Health / Monitoring
        # ---------------------------
        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
            access_log off;
        }

        # ---------------------------
        # Error Pages
        # ---------------------------
        error_page 404 /404.html;
        location = /404.html {}

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {}
    }
}