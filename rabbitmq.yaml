- name: configure rabbitmq server
  hosts: rabbitmq
  become: yes
  tasks:
  - name: coyp rabbitmq repo
    ansible.builtin.copy:
     src: rabbitmq.repo
     dest: /etc/yum.repos.d/rabbitmq.repo

  - name: install rabbitmq server
    ansible.builtin.dnf:
     name: rabbitmq server
     state: present

  - name: start and enable rabbitmq
    ansible.buitin.service:
     name: rabbitmq
     state: restarted
     name: rabbitmq

  - name: create rabbitmq user
    community.rabbitmq.rabbitmq_user:
    user: roboshop
    password: roboshop123
    topic_permissions:
      - vhost: /
        exchange: amq.topic
        read_priv: .*
        write_priv: 'prod\\.logging\\..*'
    state: present         