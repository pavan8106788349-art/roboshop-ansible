- name: configure rabbitmq server
  hosts: rabbitmq
  become: yes

  tasks:
    - name: install dependencies
      ansible.builtin.dnf:
        name:
          - curl
          - socat
          - logrotate
        state: present

    - name: install erlang repo
      ansible.builtin.shell: |
        dnf install -y https://packagecloud.io/rabbitmq/erlang/packages/el/8/erlang-26.2.5-1.el8.x86_64.rpm

    - name: install rabbitmq server rpm
      ansible.builtin.shell: |
        dnf install -y https://packagecloud.io/rabbitmq/rabbitmq-server/packages/el/8/noarch/rabbitmq-server-3.12.12-1.el8.noarch.rpm

    - name: enable management plugin
      ansible.builtin.command: rabbitmq-plugins enable rabbitmq_management

    - name: start rabbitmq
      ansible.builtin.service:
        name: rabbitmq-server
        state: started
        enabled: yes

    - name: create user
      ansible.builtin.command: rabbitmqctl add_user roboshop RoboShop@1
      ignore_errors: yes

    - name: set permissions
      ansible.builtin.command: rabbitmqctl set_permissions -p / roboshop ".*" ".*" ".*"