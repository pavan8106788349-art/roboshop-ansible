
- name: create ec2 and r53 records
  hosts: localhost
  connection: local

  vars:
    sg_id: sg-055a986a46696222d
    ami_id: ami-0055977a6e828a4f4
    domain_name: daws88s.quest
    environment: dev
    instances:
      - mongodb
      - catalogue

  tasks:
    - name: create ec2 instance
      amazon.aws.ec2_instance:
        instance_type: t3.micro
        security_group: "{{ sg_id }}"
        image_id: "{{ ami_id }}"
        name: "{{ item }}-{{ environment }}"
        tags:
          Project: roboshop
          Component: "{{ item }}"
          Environment: "{{ environment }}"
          Name: "{{ item }}-{{ environment }}"
      loop: "{{ instances }}"
      register: ec2_output

    - name: print the output
      ansible.builtin.debug:
        msg: "{{ ec2_output }}"

   
    - name: create r53 records
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item }}-{{ environment }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].private_ip_address }}"
        wait: true
      loop: "{{ ec2_output.results }}"
 



